[project]
authors = [{name = "rakass-as", email = "anna-salima.rakass@univ-nantes.fr"}]
dependencies = []
name = "GEDI_FWF_processing"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
gedi_fwf_processing = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.activation.env]
PROJ_DATA = "$CONDA_PREFIX/share/proj"

[tool.pixi.dependencies]
python = "3.11.*"
geopandas = ">=1.1.4,<2"
gdal = ">=3.13.1,<4"
matplotlib = ">=3.11.0,<4"
shapely = ">=2.1.2,<3"
h5py = ">=3.16.0,<4"
pip = ">=26.1.2,<27"
holoviews = ">=1.19,<1.21"
geoviews = ">=1.12,<1.14"
ipython = ">=9.15.0,<10"
